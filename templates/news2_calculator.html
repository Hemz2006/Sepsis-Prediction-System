<!-- templates/news2_calculator.html -->
{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto py-6">
    <h2 class="text-2xl font-bold mb-4">NEWS2 Calculator</h2>
    <form method="POST" class="space-y-4 card-accent bg-white p-6 rounded-lg shadow">
        <div>
            <label for="respiratory_rate" class="block text-sm font-medium mb-1">Respiratory Rate (breaths/min)</label>
            <input type="number" class="w-full px-3 py-2 border rounded-md" id="respiratory_rate" name="respiratory_rate" required>
        </div>

        <div>
            <label for="SpO2_Scale_1" class="block text-sm font-medium mb-1">SpO2 Scale 1 (%)</label>
            <input type="number" class="w-full px-3 py-2 border rounded-md" id="SpO2_Scale_1" name="SpO2_Scale_1" required>
        </div>

        <div>
            <label for="SpO2_Scale_2" class="block text-sm font-medium mb-1">SpO2 Scale 2 (%)</label>
            <input type="number" class="w-full px-3 py-2 border rounded-md" id="SpO2_Scale_2" name="SpO2_Scale_2" required>
        </div>

        <div class="flex items-center">
            <input type="checkbox" class="mr-2" id="supplemental_oxygen" name="supplemental_oxygen">
            <label class="text-sm" for="supplemental_oxygen">Supplemental Oxygen</label>
        </div>

        <div>
            <label for="systolic_bp" class="block text-sm font-medium mb-1">Systolic Blood Pressure (mmHg)</label>
            <input type="number" class="w-full px-3 py-2 border rounded-md" id="systolic_bp" name="systolic_bp" required>
        </div>

        <div>
            <label for="heart_rate" class="block text-sm font-medium mb-1">Heart Rate/Pulse (per min)</label>
            <input type="number" class="w-full px-3 py-2 border rounded-md" id="heart_rate" name="heart_rate" required>
        </div>

        <div>
            <label for="level_of_consciousness" class="block text-sm font-medium mb-1">Level of Consciousness</label>
            <select class="w-full px-3 py-2 border rounded-md" id="level_of_consciousness" name="level_of_consciousness" required>
                <option value="Alert">Alert</option>
                <option value="CVPU">CVPU</option>
            </select>
        </div>

        <div>
            <label for="temperature" class="block text-sm font-medium mb-1">Temperature (°C)</label>
            <input type="number" step="0.1" class="w-full px-3 py-2 border rounded-md" id="temperature" name="temperature" required>
        </div>

        <div class="text-center">
            <button type="submit" class="btn-primary">Calculate NEWS2</button>
        </div>
    </form>

    {% if result %}
    <hr class="my-6">
    <h4 class="text-lg font-semibold">Result:</h4>
    <p><strong>Total NEWS2 Score:</strong> {{ result.total_score }}</p>
    <p><strong>Risk Level:</strong> {{ result.risk_level }}</p>
    <p><strong>Interpretation:</strong> {{ result.interpretation }}</p>
    {% endif %}
</div>
{% endblock %}
